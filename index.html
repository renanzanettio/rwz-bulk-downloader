<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baixador em massa</title>
    <meta name="description" content="Baixe uma sequência de arquivos numerados direto para uma pasta do seu computador." />
    <style>
      :root {
        --bg: #1b1730;
        --panel: #241f3d;
        --line: #3a3260;
        --text: #ece8fa;
        --muted: #a29bc4;
        --accent: #8f7bff;
        --accent-ink: #14102a;
        --ok: #5fd6a0;
        --err: #ff7a8a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      #root { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }

      h1 { font-size: 28px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
      .lead { margin: 0 0 28px; color: var(--muted); max-width: 62ch; }

      .layout { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
      @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

      .settings { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
      .field { display: grid; gap: 5px; }
      .field > span { font-size: 13px; color: var(--muted); }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      input {
        width: 100%; background: var(--bg); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit;
      }
      input.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      input:disabled { opacity: .55; }

      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
      button {
        font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 14px;
        border: 1px solid var(--line); background: transparent; color: var(--text);
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
      button.primary:hover:not(:disabled) { filter: brightness(1.08); }
      .hint { font-size: 13px; color: var(--muted); margin: 0; }
      .warn { font-size: 13px; color: #ffd27a; margin: 0; }

      .queue-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
      .queue-head h2 { margin: 0; font-size: 18px; }
      .queue-head span { color: var(--muted); font-size: 14px; }

      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      /* cada linha é a própria barra de progresso */
      li.ep {
        position: relative; overflow: hidden; display: grid; grid-template-columns: 48px 1fr auto;
        gap: 12px; align-items: center; padding: 11px 14px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      }
      li.ep .fill { position: absolute; inset: 0 auto 0 0; background: rgba(143,123,255,.28); width: 0; transition: width .25s linear; }
      li.ep.done .fill { background: rgba(95,214,160,.18); }
      li.ep.error .fill { background: rgba(255,122,138,.14); width: 100%; }
      li.ep > * { position: relative; }
      .ep-n { font-weight: 600; }
      .ep-file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 14px; }
      .ep-st { font-size: 13px; text-align: right; color: var(--muted); }
      li.done .ep-st { color: var(--ok); }
      li.error .ep-st { color: var(--err); }
      li.running .ep-st { color: var(--text); }
      .empty { color: var(--muted); padding: 24px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
